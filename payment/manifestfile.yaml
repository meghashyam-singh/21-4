---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: roboshop
data:
  CART_HOST: "cart-service"
  CART_PORT: "8080"
  USER_HOST: "user-service"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq-service"
  AMQP_USER: "roboshop"
  # AMQP_PASS: "roboshop123"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: payment
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: payment
    spec:
      serviceAccountName: payment-service-account
      containers:
        - name: payment-cont
          image: meghashyam792/roboshop:payment
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: payment-port
          resources:
            requests:
              cpu: "300m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe: 
            htppGet:
              path: /health
              port: payment-port
            failureThreshold: 2
            initialDelaySeconds: 40
            periodSeconds: 40
            timeoutSeconds: 20
          livenessProbe: 
            htppGet:
              path: /health
              port: payment-port
            failureThreshold: 2
            initialDelaySeconds: 40
            periodSeconds: 40
            timeoutSeconds: 20
          envFrom:
            - configMap:
                name: payment-config
              
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: roboshop
spec:
  type: ClusterIP
  selector:
    project: roboshop
    tier: backend
    component: payment
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: payment-port

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service-account
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: payment
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::515138251473:role/ppppp